# .github/workflows/daily-briefing.yml
#
# 매 정시마다 실행 → runner.js 내부에서 schedule_hour_utc가 일치하는 사용자만 처리.
# 사용자별로 원하는 시각을 대시보드에서 설정 가능.
#
# KST 기준 예시:
#   06:00 KST = 21:00 UTC (전날)
#   07:00 KST = 22:00 UTC (전날)
#   08:00 KST = 23:00 UTC (전날)

name: Morning Briefing Scheduler

on:
  schedule:
    - cron: '30 */2 * * *'   # 2시간마다 30분에 실행 (NewsAPI 한도 방어)

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — 뉴스 수집만, LLM/이메일 없음'
        type: boolean
        default: false
      user_id:
        description: '특정 사용자만 실행 (UUID, 비워두면 전체 스케줄)'
        type: string
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Collect news
        env:
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_COUNTRY:          ${{ vars.NEWS_COUNTRY || 'us' }}
          NEWS_CATEGORIES:       ${{ vars.NEWS_CATEGORIES || 'general,technology' }}
        run: node src/collector/collect.js

      - name: Run pipeline
        env:
          # ── 필수 Secrets (GitHub repo → Settings → Secrets) ──────────────
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASS:             ${{ secrets.SMTP_PASS }}
          EMAIL_FROM:            ${{ secrets.EMAIL_FROM }}

          # ── 선택 Secrets ──────────────────────────────────────────────────
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}

          # ── Variables (미등록 시 아래 기본값 사용. 현재 repo Variables는 비어 있어
          #    전부 기본값으로 동작한다 — 값을 바꾸려면 Variables에 등록하면 된다) ──
          LLM_PROVIDER:          ${{ vars.LLM_PROVIDER || 'gemini' }}
          TTS_PROVIDER:          ${{ vars.TTS_PROVIDER || 'openai' }}
          STORAGE_PROVIDER:      supabase
          EMAIL_PROVIDER:        smtp
          STORAGE_BUCKET:        ${{ vars.STORAGE_BUCKET || 'ai-briefing-audio' }}
          NEWS_COUNTRY:          ${{ vars.NEWS_COUNTRY || 'us' }}
          NEWS_CATEGORIES:       ${{ vars.NEWS_CATEGORIES || 'general,technology' }}
          NEWS_PAGE_SIZE:        ${{ vars.NEWS_PAGE_SIZE || '5' }}
          BRIEFING_LANGUAGE:     ${{ vars.BRIEFING_LANGUAGE || 'English' }}
          # 총 3분. 기사당 목표는 llm.js가 (총목표-인사마무리)/기사수로 파생시키므로
          # 여기서 따로 주지 않는다 — 두 값을 각각 두면 서로 어긋난다(2026-08 실제 사고).
          # 실효값은 DB(a_user_settings.briefing_target_secs)가 우선하므로 양쪽을 함께 맞출 것.
          BRIEFING_TARGET_SECONDS: ${{ vars.BRIEFING_TARGET_SECONDS || '180' }}

          # 음성 합성·발송을 맥미니 로컬 VibeVoice 워커에 위임.
          # Actions는 뉴스+대본까지만 하고 audio_url=null 로그를 큐로 남긴다.
          # 'false'로 되돌리면 기존 Gemini TTS 경로로 즉시 복귀한다.
          SKIP_AUDIO:            ${{ vars.SKIP_AUDIO || 'true' }}

          # 수동 실행 입력은 env로 받아 셸에 인용부호와 함께 넘긴다.
          # run 블록에 ${{ }}를 직접 적으면 입력 문자열이 스크립트로 치환·실행되어
          # 명령 주입이 가능해진다(actionlint가 경고하는 패턴).
          INPUT_DRY_RUN:         ${{ github.event.inputs.dry_run }}
          INPUT_USER_ID:         ${{ github.event.inputs.user_id }}

        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            node src/pipeline/runner.js --dry-run
          elif [ -n "$INPUT_USER_ID" ]; then
            node src/pipeline/runner.js --user="$INPUT_USER_ID"
          else
            node src/pipeline/runner.js
          fi

      - name: Commit and push briefing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings/
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs(briefing): Add daily AI briefing [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Annotate failure
        if: failure()
        run: echo "::error title=Pipeline Failed::Check logs above for details."
