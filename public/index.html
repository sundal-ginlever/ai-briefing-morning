<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ Morning Briefing</title>
<meta name="description" content="매일 아침, AI·비트코인·크립토 시장과 팔란티어·안두릴·에레보르로 이어지는 피터 틸 사단의 최신 흐름을 한 편의 이야기로 엮어 목소리로 전하는 뉴스 브리핑.">
<link rel="icon" href="/a_thumbnail.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <header>
      <img src="/a_thumbnail.png" alt="">
      <h1>☀️ Morning Briefing</h1>
    </header>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="lang-ko" data-lang="ko">KO</button>
      <button id="lang-en" data-lang="en">EN</button>
    </div>
  </div>

  <section class="intro">
    <p data-i18n="intro"></p>
  </section>

  <section>
    <h2 data-i18n="subscribeTitle"></h2>
    <div class="feed-card">
      <p data-i18n="subscribeDesc"></p>
      <div class="feed-row">
        <input class="feed-url" id="feed-url" readonly value="…">
        <button id="copy-btn" data-i18n="copy"></button>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="episodesTitle"></h2>
    <div id="episodes"><p class="state" data-i18n="loading"></p></div>
  </section>

  <footer data-i18n="footer"></footer>

</div>
<script src="/app.js"></script>
</body>
</html>
