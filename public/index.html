<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ Morning Briefing</title>
<meta name="description" content="매일 아침 AI 앵커가 전하는 뉴스 브리핑. RSS로 구독하거나 지난 방송을 바로 들어보세요.">
<link rel="icon" href="/a_thumbnail.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <img src="/a_thumbnail.png" alt="">
    <div>
      <h1>☀️ Morning Briefing</h1>
    </div>
  </header>
  <p class="tagline">매일 아침 AI 앵커가 전하는 뉴스 브리핑입니다.</p>

  <section>
    <h2>팟캐스트 구독</h2>
    <div class="feed-card">
      <p>아래 주소를 팟캐스트 앱에 추가하면 새 방송을 자동으로 받아볼 수 있습니다.</p>
      <div class="feed-row">
        <input class="feed-url" id="feed-url" readonly value="불러오는 중…">
        <button id="copy-btn">주소 복사</button>
      </div>
    </div>
  </section>

  <section>
    <h2>지난 방송</h2>
    <div id="episodes"><p class="state">불러오는 중…</p></div>
  </section>

  <footer>AI가 매일 자동으로 만드는 개인용 브리핑입니다.</footer>

</div>
<script src="/app.js"></script>
</body>
</html>
